<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イタリアの世界遺産</title>
    <link rel="stylesheet" href="css/itaria.css">
</head>
<body>
    <header>
        <h1>イタリアの世界遺産</h1>
    </header>
    <div class="heritage-container">
        <section class="heritage">
            <h2>コロッセオ</h2>
            <div class="image-container">
                <a href="https://www.getyourguide.jp/korotsuseodi-xia-l90536/" target="_blank">
                    <img src="img/korosseo.jpg" alt="コロッセオ" class="heritage-image">
                </a>
            </div>
            <p>ローマにある巨大な円形闘技場。古代ローマ時代に建設され、剣闘士の戦いや公衆の娯楽の場として使用されました。</p>
        </section>
        <section class="heritage">
            <h2>ヴェネツィアとその潟</h2>
            <div class="image-container">
                <a href="https://www.hasegawadai2.com/%E3%83%A8%E3%83%BC%E3%83%AD%E3%83%83%E3%83%91%E3%81%AE%E4%B8%96%E7%95%8C%E9%81%BA%E7%94%A3/%E3%82%A4%E3%82%BF%E3%83%AA%E3%82%A2%E3%81%AE%E4%B8%96%E7%95%8C%E9%81%BA%E7%94%A3/%E3%83%B4%E3%82%A7%E3%83%8D%E3%83%84%E3%82%A3%E3%82%A2%E3%81%A8%E3%81%9D%E3%81%AE%E6%BD%9F/" target="_blank">
                    <img src="img/venice.jpg" alt="ヴェネツィア" class="heritage-image">
                </a>
            </div>
            <p>イタリア北部に位置する美しい水の都。歴史的な建築物と独特の運河が特徴で、世界中の観光客に愛されています。</p>
        </section>
        <section class="heritage">
            <h2>ピサの斜塔</h2>
            <div class="image-container">
                <a href="https://www.tiqets.com/ja/pisa-attractions-c260935/tickets-for-the-leaning-tower-of-pisa-p974498/" target="_blank">
                    <img src="img/pisa.jpg" alt="ピサの斜塔" class="heritage-image">
                </a>
            </div>
            <p>ピサにある独特の傾きで有名な鐘楼。建設当初から地盤の問題で傾き始めましたが、それが逆に観光名所としての魅力を増しています。</p>
        </section>
    </div>
    <footer>
        <nav class="menu">
            <a href="./index.html">HOME</a>
            <a href="./about.html">ABOUT</a>
            <a href="./france.html">FRANCE</a>
            <a href="./hawai.html">HAWAI</a>
            <a href="./itaria.html">ITARIA</a>
            <a href="./contact.html">CONTACT</a>
        </nav>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/ScrollTrigger.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            gsap.registerPlugin(ScrollTrigger);

            // ヘッダーのアニメーション
            gsap.from("header", {
                duration: 1,
                y: -50,
                opacity: 0,
                ease: "power3.out"
            });

            // 各セクションのアニメーション
            gsap.utils.toArray(".heritage").forEach((section, i) => {
                gsap.from(section, {
                    scrollTrigger: {
                        trigger: section,
                        start: "top 80%",
                    },
                    duration: 1,
                    y: 50,
                    opacity: 0,
                    ease: "power3.out",
                    delay: i * 0.2
                });
            });

            // 画像のホバーエフェクト
            const images = document.querySelectorAll('.heritage-image');
            images.forEach(img => {
                img.addEventListener('mouseenter', () => {
                    gsap.to(img, {duration: 0.3, scale: 1.1, boxShadow: "0 0 20px rgba(0,0,0,0.3)"});
                });
                img.addEventListener('mouseleave', () => {
                    gsap.to(img, {duration: 0.3, scale: 1, boxShadow: "none"});
                });
            });

            // フッターのフェードイン
            gsap.from("footer", {
                scrollTrigger: {
                    trigger: "footer",
                    start: "top bottom",
                },
                duration: 1,
                y: 50,
                opacity: 0,
                ease: "power3.out"
            });

            // メニューリンクのホバーエフェクト
            const menuLinks = document.querySelectorAll('.menu a');
            menuLinks.forEach(link => {
                link.addEventListener('mouseenter', () => {
                    gsap.to(link, {duration: 0.3, color: "#ff6b6b", scale: 1.1});
                });
                link.addEventListener('mouseleave', () => {
                    gsap.to(link, {duration: 0.3, color: "#333", scale: 1});
                });
            });
        });
    </script>
</body>
</html>
