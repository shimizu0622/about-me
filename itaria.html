    <div class="heritage-container">
        <section class="heritage">
            <h2>コロッセオ</h2>
            <div class="image-container">
                <a href="https://www.getyourguide.jp/korotsuseodi-xia-l90536/?cmp=bing&ad_id=78615292092212&adgroup_id=1257842620583678&bid_match_type=bb&campaign_id=710468905&device=c&feed_item_id=&keyword=-l90536%2F&loc_interest_ms=1888&loc_physical_ms=140110&match_type=b&msclkid=bfa5b2250008154d32e2d4ea37753adc&network=o&partner_id=CD951&target_id=dat-2330414895451235:loc-96&utm_adgroup=lc%3D90536%3Acolosseum%20underground%7Cfn%3Df1%7Cagt%3Ddsa&utm_campaign=dc%3D29%3Ait%7Clc%3D90536%3Acolosseum%20underground%7Cct%3Dcore%7Cln%3D56%3Aja%7Ctc%3Dall&utm_keyword=-l90536%2F&utm_medium=paid_search&utm_query=%E3%82%B3%E3%83%AD%E3%83%83%E3%82%BB%E3%82%AA&utm_source=bing">
                    <img src="img/korosseo.jpg" alt="コロッセオ">
                </a>
            </div>
            <p>ローマにある巨大な円形闘技場。古代ローマ時代に建設され、剣闘士の戦いや公衆の娯楽の場として使用されました。</p>
        </section>
        <section class="heritage">
            <h2>ヴェネツィアとその潟</h2>
            <div class="image-container">
                <a href="https://www.hasegawadai2.com/%E3%83%A8%E3%83%BC%E3%83%AD%E3%83%83%E3%83%91%E3%81%AE%E4%B8%96%E7%95%8C%E9%81%BA%E7%94%A3/%E3%82%A4%E3%82%BF%E3%83%AA%E3%82%A2%E3%81%AE%E4%B8%96%E7%95%8C%E9%81%BA%E7%94%A3/%E3%83%B4%E3%82%A7%E3%83%8D%E3%83%84%E3%82%A3%E3%82%A2%E3%81%A8%E3%81%9D%E3%81%AE%E6%BD%9F/">
                    <img src="img/venice.jpg" alt="ヴェネツィア">
                </a>
            </div>
            <p>イタリア北部に位置する美しい水の都。歴史的な建築物と独特の運河が特徴で、世界中の観光客に愛されています。</p>
        </section>
        <section class="heritage">
            <h2>ピサの斜塔</h2>
            <div class="image-container">
                <a href="https://www.tiqets.com/ja/pisa-attractions-c260935/tickets-for-the-leaning-tower-of-pisa-p974498/?utm_account=154002408&utm_source=bing&utm_medium=cpc&utm_campaign=710425732&utm_content=1247947012808581&msclkid=f4bea168700d1d756ea5c7a7481bf799&utm_term=lg_template%3Aja-JP%20venue_id%3A144184">
                    <img src="img/pisa.jpg" alt="ピサの斜塔">
                </a>
            </div>
            <p>ピサにある独特の傾きで有名な鐘楼。建設当初から地盤の問題で傾き始めましたが、それが逆に観光名所としての魅力を増しています。</p>
        </section>
