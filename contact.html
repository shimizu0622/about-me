<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ</title>
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>
    <h1>CONTACT</h1>

    <div class="container">
        <form id="contactForm">
            <div class="form-group">
                <label for="name">名前</label>
                <input type="text" id="name" name="name" placeholder="名前を入力" required>
            </div>
            <div class="form-group">
                <label for="tel">電話番号</label>
                <input type="tel" id="tel" name="tel" placeholder="電話番号を入力" required>
            </div>
            <div class="form-group">
                <label for="email">メールアドレス</label>
                <input type="email" id="email" name="email" placeholder="メールアドレスを入力" required>
            </div>
            <div class="form-group">
                <label for="message">お問い合わせ内容</label>
                <textarea id="message" name="message" placeholder="内容を入力" required></textarea>
            </div>
            <div class="form-group">
                <input type="submit" value="送信する">
            </div>
        </form>
        <div id="formMessage" class="hidden"></div>
    </div>

    <div class="footer">
        <div class="menu">
            <a href="./index.html">HOME</a>
            <a href="./about.html">ABOUT</a>
            <a href="./france.html">FRANCE</a>
            <a href="./hawai.html">HAWAI</a>
            <a href="./itaria.html">ITARIA</a>
            <a href="./contact.html">CONTACT</a>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            const form = document.getElementById('contactForm');
            const formMessage = document.getElementById('formMessage');

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // フォームのバリデーション
                let isValid = true;
                const name = document.getElementById('name').value;
                const tel = document.getElementById('tel').value;
                const email = document.getElementById('email').value;
                const message = document.getElementById('message').value;

                if (name.trim() === '' || tel.trim() === '' || email.trim() === '' || message.trim() === '') {
                    isValid = false;
                }

                if (!isValid) {
                    formMessage.textContent = '全ての項目を入力してください。';
                    formMessage.classList.remove('hidden');
                    formMessage.style.color = 'red';
                    return;
                }

                // 電話番号のバリデーション（簡易的な例）
                const telRegex = /^\d{10,11}$/;
                if (!telRegex.test(tel)) {
                    formMessage.textContent = '有効な電話番号を入力してください。';
                    formMessage.classList.remove('hidden');
                    formMessage.style.color = 'red';
                    return;
                }

                // メールアドレスのバリデーション
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    formMessage.textContent = '有効なメールアドレスを入力してください。';
                    formMessage.classList.remove('hidden');
                    formMessage.style.color = 'red';
                    return;
                }

                // フォーム送信の処理（ここではダミーの処理）
                setTimeout(() => {
                    formMessage.textContent = 'お問い合わせありがとうございます。メッセージを送信しました。';
                    formMessage.classList.remove('hidden');
                    formMessage.style.color = 'green';
                    form.reset();
                }, 1000);
            });

            // 入力フィールドのフォーカス時のエフェクト
            const inputs = document.querySelectorAll('input, textarea');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.style.boxShadow = '0 0 5px rgba(81, 203, 238, 1)';
                });
                input.addEventListener('blur', function() {
                    this.style.boxShadow = 'none';
                });
            });
        });
    </script>
</body>
</html>
