<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ</title>
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>
    <h1>CONTACT</h1>

    <div class="container">
        <form id="contactForm">
            <div class="form-group">
                <label for="name">名前</label>
                <input type="text" id="name" name="name" placeholder="名前を入力" required>
            </div>
            <div class="form-group">
                <label for="tel">電話番号</label>
                <input type="tel" id="tel" name="tel" placeholder="電話番号を入力" required>
            </div>
            <div class="form-group">
                <label for="email">メールアドレス</label>
                <input type="email" id="email" name="email" placeholder="メールアドレスを入力" required>
            </div>
            <div class="form-group">
                <label for="message">お問い合わせ内容</label>
                <textarea id="message" name="message" placeholder="内容を入力" required></textarea>
            </div>
            <div class="form-group">
                <input type="submit" value="送信する">
            </div>
        </form>
        <div id="formMessage" class="hidden"></div>
    </div>

    <div class="footer">
        <div class="menu">
            <a href="./index.html">HOME</a>
            <a href="./about.html">ABOUT</a>
            <a href="./france.html">FRANCE</a>
            <a href="./hawai.html">HAWAI</a>
            <a href="./itaria.html">ITARIA</a>
            <a href="./contact.html">CONTACT</a>
        </div>
    </div>
    
    <script src="js/contact.js"></script>
</body>
</html>
