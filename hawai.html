<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハワイの世界遺産</title>
    <link rel="stylesheet" href="css/hawai.css">
</head>
<body>
    <header>
        <h1>ハワイの世界遺産</h1>
    </header>
    <div class="heritage-container">
        <section class="heritage">
            <h2>ハワイ火山国立公園</h2>
            <div class="image-container">
                <a href="https://www.nps.gov/havo/index.htm" target="_blank">
                    <img src="img/kazanpark.jpg" alt="ハワイ火山国立公園" class="heritage-image">
                </a>
            </div>
            <p>キラウエア火山とマウナ・ロア火山を含む公園で、火山の活動や形成過程を観察できる貴重な場所です。</p>
        </section>
        <section class="heritage">
            <h2>パールハーバー</h2>
            <div class="image-container">
                <a href="https://pearlharbortour.jp/" target="_blank">
                    <img src="img/parlha-ba-.jpg" alt="パールハーバー" class="heritage-image">
                </a>
            </div>
            <p>第二次世界大戦の歴史的な戦場であり、現在は記念館として多くの人々が訪れています。</p>
        </section>
        <section class="heritage">
            <h2>ハレアカラ国立公園</h2>
            <div class="image-container">
                <a href="https://www.nps.gov/hale/index.htm" target="_blank">
                    <img src="img/haleakara.jpg" alt="ハレアカラ国立公園" class="heritage-image">
                </a>
            </div>
            <p>マウイ島にある広大な国立公園で、絶景のサンライズや珍しい生態系が楽しめます。</p>
        </section>
    </div>
    <footer>
        <nav class="menu">
            <a href="./index.html">HOME</a>
            <a href="./about.html">ABOUT</a>
            <a href="./france.html">FRANCE</a>
            <a href="./hawai.html">HAWAI</a>
            <a href="./itaria.html">ITARIA</a>
            <a href="./contact.html">CONTACT</a>
        </nav>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/ScrollTrigger.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            gsap.registerPlugin(ScrollTrigger);

            // ヘッダーのアニメーション
            gsap.from("header", {
                duration: 1,
                y: -50,
                opacity: 0,
                ease: "power3.out"
            });

            // 各セクションのアニメーション
            gsap.utils.toArray(".heritage").forEach((section, i) => {
                gsap.from(section, {
                    scrollTrigger: {
                        trigger: section,
                        start: "top 80%",
                    },
                    duration: 1,
                    y: 50,
                    opacity: 0,
                    ease: "power3.out",
                    delay: i * 0.2
                });
            });

            // 画像のホバーエフェクト
            const images = document.querySelectorAll('.heritage-image');
            images.forEach(img => {
                img.addEventListener('mouseenter', () => {
                    gsap.to(img, {duration: 0.3, scale: 1.1, boxShadow: "0 0 20px rgba(0,0,0,0.3)"});
                });
                img.addEventListener('mouseleave', () => {
                    gsap.to(img, {duration: 0.3, scale: 1, boxShadow: "none"});
                });
            });

            // フッターのフェードイン
            gsap.from("footer", {
                scrollTrigger: {
                    trigger: "footer",
                    start: "top bottom",
                },
                duration: 1,
                y: 50,
                opacity: 0,
                ease: "power3.out"
            });
        });
    </script>
</body>
</html>
