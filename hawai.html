<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハワイの世界遺産</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>ハワイの世界遺産</h1>
    </header>
    <section class="heritage">
        <h2>ハワイ火山国立公園</h2>
        <img src="img/kazanpark.jpg" alt="ハワイ火山国立公園">
        <p>キラウエア火山とマウナ・ロア火山を含む公園で、火山の活動や形成過程を観察できる貴重な場所です。</p>
    </section>
    <section class="heritage">
        <h2>パールハーバー</h2>
        <img src="img/parlha-ba-.jpg" alt="パールハーバー">
        <p>第二次世界大戦の歴史的な戦場であり、現在は記念館として多くの人々が訪れています。</p>
    </section>
    <section class="heritage">
        <h2>ハレアカラ国立公園</h2>
        <img src="img/haleakara.jpg" alt="ハレアカラ国立公園">
        <p>マウイ島にある広大な国立公園で、絶景のサンライズや珍しい生態系が楽しめます。</p>
    </section>
</body>
</html>
