<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フランスの世界遺産</title>
    <link rel="stylesheet" href="css/france.css">
</head>
<body>
    <header>
        <h1>フランスの世界遺産</h1>
    </header>
    <div class="heritage-container">
        <section class="heritage">
            <h2>エッフェル塔</h2>
            <div class="image-container">
                <a href="https://www.toureiffel.paris/jp" target="_blank">
                    <img src="img/eiffeltower.jpg" alt="エッフェル塔" class="heritage-image">
                </a>
            </div>
            <p>パリの象徴的なランドマークで、1889年に建設されました。フランスの技術力を象徴する建物です。</p>
        </section>
        <section class="heritage">
            <h2>モン・サン・ミシェル</h2>
            <div class="image-container">
                <a href="https://www.tiqets.com/ja/mont-saint-michel-abbey-tickets-l145867/" target="_blank">
                    <img src="img/MontSaintMichel.jpg" alt="モン・サン・ミシェル" class="heritage-image">
                </a>
            </div>
            <p>ノルマンディー地方にある美しい島の修道院で、潮の満ち引きによって島になることが知られています。</p>
        </section>
        <section class="heritage">
            <h2>ヴェルサイユ宮殿</h2>
            <div class="image-container">
                <a href="https://www.chateauversailles.fr/" target="_blank">
                    <img src="img/versailles.jpg" alt="ヴェルサイユ宮殿" class="heritage-image">
                </a>
            </div>
            <p>ルイ14世が建設した豪華な宮殿で、フランスの絶対君主制を象徴する建築です。</p>
        </section>
    </div>
    <footer>
        <nav class="menu">
            <a href="./index.html">HOME</a>
            <a href="./about.html">ABOUT</a>
            <a href="./france.html">FRANCE</a>
            <a href="./hawai.html">HAWAI</a>
            <a href="./itaria.html">ITARIA</a>
            <a href="./contact.html">CONTACT</a>
        </nav>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/ScrollTrigger.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            gsap.registerPlugin(ScrollTrigger);

            // ヘッダーのアニメーション
            gsap.from("header", {
                duration: 1,
                y: -50,
                opacity: 0,
                ease: "power3.out"
            });

            // 各セクションのアニメーション
            gsap.utils.toArray(".heritage").forEach((section, i) => {
                gsap.from(section, {
                    scrollTrigger: {
                        trigger: section,
                        start: "top 80%",
                    },
                    duration: 1,
                    y: 50,
                    opacity: 0,
                    ease: "power3.out",
                    delay: i * 0.2
                });
            });

            // 画像のホバーエフェクト
            const images = document.querySelectorAll('.heritage-image');
            images.forEach(img => {
                img.addEventListener('mouseenter', () => {
                    gsap.to(img, {duration: 0.3, scale: 1.1, boxShadow: "0 0 20px rgba(0,0,0,0.3)"});
                });
                img.addEventListener('mouseleave', () => {
                    gsap.to(img, {duration: 0.3, scale: 1, boxShadow: "none"});
                });
            });

            // スムーズスクロール
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    document.querySelector(this.getAttribute('href')).scrollIntoView({
                        behavior: 'smooth'
                    });
                });
            });

            // フッターのフェードイン
            gsap.from("footer", {
                scrollTrigger: {
                    trigger: "footer",
                    start: "top bottom",
                },
                duration: 1,
                y: 50,
                opacity: 0,
                ease: "power3.out"
            });
        });
    </script>
</body>
</html>
