<body>
    <header>
        <h1>フランスの世界遺産</h1>
    </header>
    <div class="heritage-container">
        <section class="heritage">
            <h2>エッフェル塔</h2>
            <div class="image-container">
                <a href="https://www.toureiffel.paris/jp" target="_blank">
                    <img src="img/eiffeltower.jpg" alt="エッフェル塔" class="heritage-image">
                </a>
            </div>
            <p>パリの象徴的なランドマークで、1889年に建設されました。フランスの技術力を象徴する建物です。</p>
        </section>
        <section class="heritage">
            <h2>モン・サン・ミシェル</h2>
            <div class="image-container">
                <a href="https://www.tiqets.com/ja/mont-saint-michel-abbey-tickets-l145867/" target="_blank">
                    <img src="img/MontSaintMichel.jpg" alt="モン・サン・ミシェル" class="heritage-image">
                </a>
            </div>
            <p>ノルマンディー地方にある美しい島の修道院で、潮の満ち引きによって島になることが知られています。</p>
        </section>
        <section class="heritage">
            <h2>ヴェルサイユ宮殿</h2>
            <div class="image-container">
                <a href="https://www.chateauversailles.fr/" target="_blank">
                    <img src="img/versailles.jpg" alt="ヴェルサイユ宮殿" class="heritage-image">
                </a>
            </div>
            <p>ルイ14世が建設した豪華な宮殿で、フランスの絶対君主制を象徴する建築です。</p>
        </section>
    </div>
