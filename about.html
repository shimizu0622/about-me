<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロフィール</title>
    <link rel="stylesheet" href="css/about.css">
</head>
<body>
    <h1 class="fade-in">ABOUT</h1>
    <div class="profile-card slide-in">
        <h2>清水　晴斗</h2>
        <div class="profile-section pop-in">
            <h3>出身地</h3>
            <p>滋賀県</p>
        </div>
        <div class="profile-section pop-in">
            <h3>誕生日</h3>
            <p>2005年6月22日</p>
        </div>
        <div class="profile-section pop-in">
            <h3>職業</h3>
            <p>学生</p>
        </div>
        <div class="profile-section pop-in">
            <h3>好きなこと</h3>
            <p>音楽を聴きながら運転すること。</p>
        </div>
    </div>

    <div class="footer fade-in">
        <div class="menu">
            <a href="./index.html">HOME</a>
            <a href="./about.html">ABOUT</a>
            <a href="./france.html">FRANCE</a>
            <a href="./hawai.html">HAWAI</a>
            <a href="./itaria.html">ITARIA</a>
            <a href="./contact.html">CONTACT</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            // ページ要素のアニメーション
            gsap.from("h1", {duration: 1, y: -50, opacity: 0, ease: "power3.out"});
            gsap.from(".profile-card", {duration: 1, y: 50, opacity: 0, ease: "power3.out", delay: 0.5});
            
            // プロフィールセクションのアニメーション
            gsap.from(".profile-section", {
                duration: 0.8,
                y: 30,
                opacity: 0,
                stagger: 0.2,
                ease: "power2.out",
                delay: 1
            });

            // フッターのアニメーション
            gsap.from(".footer", {duration: 1, y: 50, opacity: 0, ease: "power3.out", delay: 1.5});

            // プロフィールセクションのホバーエフェクト
            document.querySelectorAll('.profile-section').forEach(section => {
                section.addEventListener('mouseenter', () => {
                    gsap.to(section, {duration: 0.3, scale: 1.05, backgroundColor: "rgba(255, 228, 196, 0.2)"});
                });
                section.addEventListener('mouseleave', () => {
                    gsap.to(section, {duration: 0.3, scale: 1, backgroundColor: "transparent"});
                });
            });

            // メニューリンクのホバーエフェクト
            document.querySelectorAll('.menu a').forEach(link => {
                link.addEventListener('mouseenter', () => {
                    gsap.to(link, {duration: 0.3, y: -3, color: "#ff6b6b"});
                });
                link.addEventListener('mouseleave', () => {
                    gsap.to(link, {duration: 0.3, y: 0, color: "#333"});
                });
            });
        });
    </script>
</body>
</html>
