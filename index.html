<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="header">
        <div class="site-title">自己紹介サイト</div>
        <div class="menu">
            <a href="index.html">HOME</a>
            <a href="about.html">ABOUT</a>
            <a href="france.html">FRANCE</a>
            <a href="hawai.html">HAWAI</a>
            <a href="itaria.html">ITARIA</a>
            <a href="contact.html">CONTACT</a>
        </div>
        <div class="spacer"></div>
    </div>

    <div class="welcome">
        <h1 class="intro-text floating">ようこそ</h1>
    </div>

    <div class="container fade-in hidden">
        <div class="main">
            <div class="link">
                <a href="index.html">HOME</a>
            </div>
            <div class="link">
                <a href="about.html">ABOUT</a>
            </div>
            <div class="link">
                <a href="france.html">FRANCE</a>
            </div>
            <div class="link">
                <a href="hawai.html">HAWAI</a>
            </div>
            <div class="link">
                <a href="itaria.html">ITARIA</a>
            </div>
            <div class="link">
                <a href="contact.html">CONTACT</a>
            </div>
        </div>
    </div>

    <div class="bg-animation">
        <div style="left:10%;animation-delay:0s;"></div>
        <div style="left:20%;animation-delay:2s;animation-duration:12s;"></div>
        <div style="left:35%;animation-delay:4s;"></div>
        <div style="left:50%;animation-delay:6s;animation-duration:18s;"></div>
        <div style="left:65%;animation-delay:8s;"></div>
        <div style="left:80%;animation-delay:10s;animation-duration:20s;"></div>
        <div style="left:95%;animation-delay:12s;"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            setTimeout(() => {
                document.querySelector('.container').classList.remove('hidden');
                document.querySelectorAll('.link').forEach((link, index) => {
                    setTimeout(() => {
                        link.classList.add('visible');
                    }, index * 200);
                });
            }, 2000);
        });
    </script>
</body>
</html>
